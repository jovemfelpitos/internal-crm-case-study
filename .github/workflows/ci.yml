name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Demo publica e testes (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      SECRET_KEY: ci-session-for-disposable-tests-only
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Verificar arquivos publicados
        run: python tools/check_publication.py
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Executar testes isolados
        run: python -m unittest discover -s tests -p "test_*.py"
